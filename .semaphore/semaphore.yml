version: v1.0
name: Test/Lint Portfolio
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Verify
    task:
      jobs:
        - name: Lint · Typecheck · Build
          commands:
            - checkout
            - sem-version node 22
            - cache restore
            - npm ci
            - cache store
            - npm run lint
            - npm run typecheck
            - npm run generate
promotions:
  - name: Deploy
    pipeline_file: deployment.yml
